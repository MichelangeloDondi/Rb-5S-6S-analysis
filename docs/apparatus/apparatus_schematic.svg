  <text x="140" y="500" text-anchor="end" font-size="10.5" fill="#6b6b69"><tspan font-weight="bold" fill="#2b2b2a">5</tspan> · pipe</text>

  <g transform="rotate(3 170 394)">
    <rect x="104" y="318" width="132" height="152" rx="12" fill="none" stroke="#2b2b2a" stroke-width="1.5"/>
