<svg xmlns="http://www.w3.org/2000/svg" viewBox="-85 58 880 785" font-family="Helvetica, Arial, sans-serif">
  <!-- The 2025 5S->6S bench. Components numbered 1-13 as in the annotated
       bench photograph (defense presentation, slide 9). Delivery
       (RECOLLECTION, 2026-08-03): the M Squared head lies horizontal; a
       fibre (coil symbol) runs vertically from it to the WS-8 wavemeter,
       and the beam leaves it vertically through the optical isolator, then
       the lambda/2 + PBS working in reflection set the power sent to the
       cell and turn the beam onto the horizontal arm, to the fold mirror
       and up the cell axis. Both mirrors sit in x-y kinematic mounts. All
       lenses are 1 inch and drawn equal. Distances on the cell axis are to
       scale: 150 mm = 180 px, both f150s at 150 mm from the waist, the f18
       at about 25 mm = 30 px from the focus, reaching the waist through an
       aperture in the oven wall. The oven is tilted about 3 degrees
       against window reflections, the pipes reach inside the foil wrap
       without touching the cell, and the focus sits near the cell's lower
       corner on the detection side so the f18 re-images the fluorescence
       spot onto the PMT; the signal chain runs in line, PMT to preamp to
       scope. The dashed return retraces and is stopped by the isolator.
       993 nm dark red #a63430 (infrared), 795 nm red #d62728 (visible).
       2026-08-03. -->
  <rect x="-85" y="58" width="880" height="785" fill="#fcfcfb"/>

  <!-- ===================== the 993 nm beam ===================== -->
  <rect x="566" y="660" width="8" height="108" fill="#a63430" opacity="0.6"/>
  <polygon points="166,776 558,776 558,784 174,784" fill="#a63430" opacity="0.6"/>
  <polygon points="166,620 174,620 174,784 166,776" fill="#a63430" opacity="0.6"/>
  <polygon points="166,620 174,620 170.4,448 170.4,440 169.6,440 169.6,448" fill="#a63430" opacity="0.6"/>
  <polygon points="169.6,440 170.4,440 170.4,432 174,260 166,260 169.6,432" fill="#a63430" opacity="0.6"/>
  <rect x="166" y="92" width="8" height="168" fill="#a63430" opacity="0.6"/>
  <polygon points="476,776 476,784 464,780" fill="#a63430"/>
  <polygon points="166,726 174,726 170,714" fill="#a63430"/>
  <text x="360" y="768" text-anchor="middle" font-size="11" fill="#a63430" font-weight="bold">993 nm</text>

