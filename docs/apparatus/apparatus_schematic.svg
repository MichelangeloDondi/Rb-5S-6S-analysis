  <circle cx="170" cy="440" r="2.4" fill="#2b2b2a"/>
  <text x="88" y="345" text-anchor="end" font-size="12" fill="#2b2b2a" font-weight="bold">6 · Rb cell in oven</text>
  <text x="88" y="363" text-anchor="end" font-size="10.5" fill="#6b6b69">70–130 °C, foil-wrapped</text>
  <text x="88" y="377" text-anchor="end" font-size="10.5" fill="#6b6b69">thermocouples 1–4</text>
  <text x="88" y="391" text-anchor="end" font-size="10.5" fill="#6b6b69">tilted ≈ 3° against window reflections</text>
  <text x="88" y="409" text-anchor="end" font-size="10.5" fill="#2b2b2a">two-photon 5S₁/₂→6S₁/₂</text>
  <text x="88" y="452" text-anchor="end" font-size="10.5" fill="#2b2b2a">w₀ ≈ 64 µm</text>
  <text x="88" y="463" text-anchor="end" font-size="9" fill="#6b6b69">adopted from the beamline lineage,</text>
  <text x="88" y="474" text-anchor="end" font-size="9" fill="#6b6b69">not measured here</text>
  <line x1="92" y1="448" x2="164" y2="442" stroke="#a9a9a5" stroke-width="0.8" stroke-dasharray="2 3"/>

