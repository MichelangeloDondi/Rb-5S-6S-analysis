  <text x="330" y="588" text-anchor="middle" font-size="10.5" fill="#6b6b69">6S → 5P₁/₂ → 5S cascade</text>

  <line x1="304" y1="440" x2="318" y2="440" stroke="#a9a9a5" stroke-width="1.4"/>
