  <!-- ===================== detection: the f18 at 25 mm, through the oven aperture =====================
       Corrected from recollection, 2026-08-05 (RECOLLECTION): the collection
       cone opens from the fluorescence spot to the EDGE of the f18 lens and
       is re-imaged, converging through the half-inch 795 nm filter to a
       focus on the side window of the PMT. The PMT tube's AXIS IS PARALLEL
       TO THE BEAM (here "vertical" means beam-parallel, not
       along gravity: on the bench the tube lies horizontal in the bench
       plane, window toward the cell, as the 2025-07-18 detection photograph
       shows, with the heat sink on the holder beside the tube). The page
       draws the beam axis vertically, so the tube is drawn tall.
       Half-inch optics drawn to the axis scale (12.7 mm = 15 px).
       The electronics keep the amplifier triangle (the standard symbol) and
       a scope box sized like the other instrument boxes, no longer the
       largest thing on the bench. -->
  <polygon points="170,440 200,432 200,448" fill="#d62728" opacity="0.6"/>
  <polygon points="200,432 200,448 258,441 258,439" fill="#d62728" opacity="0.6"/>
