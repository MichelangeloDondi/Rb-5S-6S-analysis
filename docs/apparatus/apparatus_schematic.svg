  <rect x="258" y="424" width="5" height="32" fill="#e8e8e6" stroke="#6b6b69" stroke-width="1"/>
  <circle cx="262" cy="440" r="1.8" fill="#d62728"/>
  <g stroke="#6b6b69" stroke-width="2">
    <line x1="304" y1="472" x2="318" y2="472"/><line x1="304" y1="482" x2="318" y2="482"/>
    <line x1="304" y1="492" x2="318" y2="492"/><line x1="304" y1="502" x2="318" y2="502"/>
