[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rb5s6s"
version = "3.7.0"
description = "Physics-based forward-model analysis of the Rb 5S->6S two-photon lineshape (2025 OIST archival campaign)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Michelangelo Dondi" },
]
dependencies = [
    # THE FLOOR IS DERIVED, NOT CHOSEN (2026-08-13). numpy 2.5 replaced
    # np.convolve and is ten times faster on the 9000-point convolution
    # this lineshape model is built from, which is why it is the floor.
    # Everything else follows: numpy 2.5.2 declares requires-python
    # >=3.12, and scipy caps numpy from above (1.15 declares numpy<2.5,
    # excluding 2.5 exactly), so numpy>=2.5 forces scipy>=1.16 and
    # Python >=3.12. pandas and matplotlib are at the oldest versions
    # built against the numpy 2 ABI. Every floor here is the version the
    # minimum CI leg actually pins and runs, so the manifest promises
    # exactly what is exercised.
    "numpy>=2.5",
    "scipy>=1.16",
    "pandas>=2.2.3",
    "matplotlib>=3.9.4",
]

keywords = [
    "atomic physics", "spectroscopy", "two-photon", "rubidium",
    "lineshape", "AC Stark", "light shift", "vapour cell",
]

# Trove classifiers. Kept deliberately short: only ones that are TRUE. There is
# no "Development Status" claim because this is an analysis of a finished
# campaign rather than software on a maturity track, and no OS classifier
# because nothing here is platform-specific.
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/MichelangeloDondi/Rb-5S-6S-analysis"
Documentation = "https://github.com/MichelangeloDondi/Rb-5S-6S-analysis/blob/main/docs/README.md"
"Results ledger" = "https://github.com/MichelangeloDondi/Rb-5S-6S-analysis/blob/main/docs/RESULTS.md"
"How to read an uncertainty" = "https://github.com/MichelangeloDondi/Rb-5S-6S-analysis/blob/main/docs/UNCERTAINTY.md"

[project.optional-dependencies]
# pypdf is used ONLY by tests/test_lit_quotes_are_verbatim.py, which checks that
# quotations in the literature notes are verbatim against the held PDFs. Those
# PDFs are gitignored, so that test skips in CI and pypdf is optional there --
# but it must be installed locally for the guard to actually guard.
dev = ["pytest>=7", "pypdf>=3"]
# sympy is used by exactly ONE script, scripts/run_zeeman_depletion.py, which
# evaluates Wigner 3j and 6j symbols and a small density matrix in EXACT
# rational arithmetic. Nothing in the library, in run_all.sh, or in the test
# battery needs it, which is why it is an extra rather than a dependency, and
# why it went undeclared until 2026-08-10: it was installed in the development
# environment and nothing in CI or in a clean clone ever asked for it. The
# script now says so and exits rather than raising ImportError.
cascade = ["sympy>=1.12"]

[tool.setuptools]
packages = ["rb5s6s"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: high-statistics closure test, skipped by default; run with --runslow (CI always does)",
]

[tool.ruff]
# 100, not the default 88: the p99 line in this tree is 94 characters, and the
# long lines are overwhelmingly scientific docstrings where re-wrapping would
# break tables and formulae. Anything past 100 is a genuine offender.
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
# Deliberate, not unexamined. E702: this tree uses semicolon-joined parallel
# assignments for index masking and unpacking (`freqs[i] = freqs[i][m]; ...`),
# which keeps related array operations on one visual line; splitting the ~130
# instances would be churn without a defect fixed. E741: `l`, `I` and `O` appear
# as conventional physics symbols (path length, intensity) where renaming would
# be less readable, not more. E731: a handful of local lambdas in numeric inner
# loops. E501: docstrings here carry tables, formulae and provenance prose that
# re-wrapping would break, and console output is column-aligned; the p99 code
# line is 94 characters, so length is not the problem length rules solve.
# Everything else in E and F is enforced, and F -- the rules that catch real
# defects -- is CLEAN. The F811 it caught was a test defined twice, so one copy
# had never run; the F841s were dead assignments left by refactors.
ignore = ["E702", "E741", "E731", "E501"]

[tool.ruff.lint.per-file-ignores]
# the package surface deliberately re-exports names it does not itself use
"rb5s6s/__init__.py" = ["F401"]
# analysis drivers put sys.path setup before their local imports
"scripts/*.py" = ["E402"]
# conftest documents the archive-optional skip policy above its imports
"tests/conftest.py" = ["E402"]
