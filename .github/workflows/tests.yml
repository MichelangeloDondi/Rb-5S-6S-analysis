# CI: the full pytest battery.
#
# COST NOTE (2026-07-29). This repository is PRIVATE, so every minute here is
# billed against the account's Actions allowance, while the public mirror
# (MichelangeloDondi/Rb-5S-6S-analysis) runs the same battery for free and is
# the reference green check. Running the full three-way matrix on every push
# cost ~35 minutes a push and exhausted the allowance.
#
# So the matrix now runs on TAGS and on manual dispatch only. Ordinary pushes
# get `lint` and a single fast-suite job, ~3 minutes. Nothing is lost: the full
# battery still runs locally before every commit (house rule), and the public
# mirror runs it on every push at no cost.
#
# THREE jobs, not one (fix, 2026-07-11): the original single
# latest-deps job silently installed numpy 2.x while pyproject declared
# numpy>=1.24, so code calling numpy-2-only API passed CI and failed on
# every environment the manifest actually promised to support. The
# "minimum" job pins the declared dependency FLOOR so the contract is
# tested, not assumed.
#
# The data-manifest tests re-hash all of data_raw/ (~20 MB, committed), so a
# green run certifies code AND dataset integrity together.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # run the full matrix on demand


jobs:
  lint:
    # Separate from pytest so a style failure is never confused with a physics
    # failure. Config and its justified ignores live in pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check rb5s6s scripts tests

  # Every push gets this instead of the matrix: the fast suite on one
  # interpreter, ~2 minutes. The slow closures and the numpy-floor job run on
  # tags and on demand.
  fast:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q          # fast suite only; --runslow runs on tags

  # The full battery: tags and manual dispatch only -- see the cost note above.
  pytest:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            deps: minimum   # the declared floor: numpy 1.24 / scipy 1.10
          - python-version: "3.9"
            deps: latest
          - python-version: "3.11"
            deps: latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: pin declared minimum dependencies
        if: matrix.deps == 'minimum'
        run: pip install "numpy==1.24.4" "scipy==1.10.1"
      # FRESHNESS_CHECK on one leg only: the committed-CSV-vs-fresh-run check
      # takes ~4 min and its answer cannot differ between interpreters, so
      # running it three times costs ~8 minutes of Actions time for nothing.
      - run: pytest -q --runslow   # CI runs the full battery incl. slow closure tests
        env:
          FRESHNESS_CHECK: ${{ (matrix.python-version == '3.11' && matrix.deps == 'latest') && '1' || '0' }}
