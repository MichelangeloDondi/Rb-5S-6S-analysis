# CI: the full pytest battery.
#
# COST NOTE (2026-07-29). This repository is PRIVATE, so every minute here is
# billed against the account's Actions allowance, while the public mirror
# (MichelangeloDondi/Rb-5S-6S-analysis) runs the same battery for free and is
# the reference green check. Running the full matrix on every push cost ~35
# minutes a push and exhausted the allowance.
#
# So the matrix now runs on TAGS and on manual dispatch only. Ordinary pushes
# get `lint` and a single fast-suite job, ~3 minutes. Nothing is lost: the full
# battery still runs locally before every commit (house rule), and the public
# mirror runs it on every push at no cost.
#
# A MATRIX, not one job (fix, 2026-07-11): the original single latest-deps
# job silently installed numpy 2.x while pyproject declared numpy>=1.24, so
# code calling numpy-2-only API passed CI and failed on every environment the
# manifest actually promised to support. The "minimum" leg pins the declared
# dependency FLOOR so the contract is tested, not assumed.
#
# The data-manifest tests re-hash all of data_raw/ (~20 MB, committed), so a
# green run certifies code AND dataset integrity together.
name: tests

# TRIGGERS: manual only, from 2026-07-30.
#
# This repository is PRIVATE, so its Actions are billed, and the account's
# Actions are blocked: every job fails in 2-3 seconds without starting, with
# "The job was not started because recent account payments have failed or your
# spending limit needs to be increased". `lint` is `pip install ruff && ruff
# check` and cannot fail on content, so a 3-second lint failure is proof the job
# never ran. Nothing here is broken.
#
# Pushing therefore produced one red run and one failure email per commit, for
# CI that cannot execute. The owner has decided not to pay, so the honest
# configuration is not to schedule work that cannot run: push and pull_request
# are removed and the workflow is manual only. If the billing state is ever
# cleared, add them back -- nothing else needs changing.
#
# Coverage is unaffected. The full battery runs locally before every commit
# (house rule), and the PUBLIC mirror runs the two-leg --runslow matrix on
# every push for free; it is the reference green check.
on:
  workflow_dispatch:


jobs:
  lint:
    # Separate from pytest so a style failure is never confused with a physics
    # failure. Config and its justified ignores live in pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check rb5s6s scripts tests

  # Every push gets this instead of the matrix: the fast suite on one
  # interpreter, ~2 minutes. The slow closures and the numpy-floor job run on
  # tags and on demand.
  fast:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q          # fast suite only; --runslow runs on tags

  # The full battery: tags and manual dispatch only -- see the cost note above.
  pytest:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TWO legs, not three (2026-08-11). The old matrix ran 3.9 twice and
        # 3.11 once, which spent two thirds of its time on an interpreter that
        # reached end of life in October 2025 and whose 'latest' leg was nearly
        # a duplicate of the maintainer's own machine (3.9.6). What each leg is
        # FOR, so a future change does not collapse them by accident:
        #   minimum -- the declared floor, and the only check that a new
        #              annotation or stdlib call has not silently raised it.
        #   latest  -- a current interpreter with current dependencies, which
        #              is deliberately UNLIKE the development machine. This is
        #              the leg that caught every real defect on 2026-08-11:
        #              a matplotlib API absent on one canvas class, and two
        #              figures whose labels cleared a guard locally by two
        #              pixels and not under a different font stack.
        #
        # The ceiling is PINNED, not floated to "3". scipy lags the newest
        # interpreter: at the time of writing numpy already ships cp315 wheels
        # and scipy does not, so a floating ceiling that resolved to 3.15 would
        # find no scipy wheel and fall back to a source build, which fails
        # slowly and with no code change to blame it on. Bump this by hand when
        # the whole dependency set has wheels for the next version.
        #
        # 3.14 rather than 3.13 because the maintainer's machine has 3.14, so
        # this leg can be reproduced locally when it disagrees with the gate.
        include:
          - python-version: "3.12"
            deps: minimum   # every declared floor pinned; see the step note below
          - python-version: "3.14"
            deps: latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # ALL FOUR floors, not two. The first two-leg run failed here
      # (2026-08-12): on 3.11 the editable install resolves LATEST matplotlib
      # (requires numpy>=1.25) and pandas (numpy-2 ABI), and pinning numpy to
      # the floor afterwards breaks both underneath. The old 3.9 leg only
      # worked because 3.9 itself capped pandas and matplotlib at versions
      # that tolerated numpy 1.24, which also means the DECLARED pandas 1.5
      # and matplotlib 3.6 floors were never actually tested. The floors in
      # pyproject were raised to match what this leg pins, so the manifest
      # promises exactly the oldest combination CI exercises.
      - name: pin declared minimum dependencies
        if: matrix.deps == 'minimum'
        run: pip install "numpy==2.5.0" "scipy==1.16.0" "pandas==2.2.3" "matplotlib==3.9.4"
      # FRESHNESS_CHECK on BOTH legs, and the two verdicts mean different
      # things. The pinned leg tests RECORD INTEGRITY: the committed CSVs
      # against their producers under the dependency set the record was made
      # for. The latest leg is an ENVIRONMENT-DRIFT MONITOR: a red there with
      # a green pinned leg means the current ecosystem reproduces the record
      # only outside tolerance, which is a property of the environment and
      # not of the record. This replaces a comment claiming the answer
      # "cannot differ between interpreters", a premise measured false on
      # 2026-08-18: the legs differ in dependencies and platform, and the
      # first real run diverged (noise_model chi2_red 5.4%, modelform
      # full_exp 62% on the unpinned leg) while the pinned leg and both
      # local environments matched every cell.
      - run: pytest -q --runslow   # CI runs the full battery incl. slow closure tests
        env:
          # Fatal only where it tests record integrity, the pinned leg.
          FRESHNESS_CHECK: ${{ (matrix.deps == 'minimum') && '1' || '0' }}
      # The drift monitor: same check, latest deps, NON-FATAL. A red here
      # with a green pinned leg is an environment finding, not a record
      # defect, and it must not redden a release. Skips without raw traces.
      - name: freshness under latest deps (environment-drift monitor)
        if: matrix.deps == 'latest'
        continue-on-error: true
        run: |
          if [ -d data_raw/p_sweep ]; then
            python scripts/verify_results_fresh.py
          else
            echo "no raw traces in this checkout: monitor skipped, and this skip is stated rather than silent"
          fi
