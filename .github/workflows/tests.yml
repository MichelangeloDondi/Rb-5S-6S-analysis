# CI: the full pytest battery.
#
# This repository is PUBLIC, so GitHub Actions minutes are free here and the
# full battery runs on EVERY push. That is deliberate: the private tree the
# ports come from is billed per minute and has run on manual dispatch alone
# since 2026-07-30, so this repo is the reference green check for the slow
# closure tests.
#
# It did not start out that way. The cost-gated workflow was copied here
# verbatim along with its cost note, which left THIS repo skipping --runslow on
# push while its own comment claimed the public mirror ran it on every push --
# a promise the file broke about itself. Found by a skip audit, 2026-07-29. If
# the gates below ever grow an `if:` on the matrix job again, check that the
# claim above is still true.
#
# THREE jobs, not one (fix, 2026-07-11): the original single
# latest-deps job silently installed numpy 2.x while pyproject declared
# numpy>=1.24, so code calling numpy-2-only API passed CI and failed on
# every environment the manifest actually promised to support. The
# "minimum" job pins the declared dependency FLOOR so the contract is
# tested, not assumed.
#
# The data-manifest tests re-hash data_raw/, which in this mirror holds only the
# README and MANIFEST.csv -- the raw traces are held privately. So a green run
# here certifies the CODE; dataset integrity is certified in the archive.
name: tests

# TRIGGERS: every push, and that is the point -- this repo is the reference
# green check, because the private tree the ports come from runs its Actions on
# manual dispatch alone. On 2026-07-30 that tree was set to
# workflow_dispatch-only, and the change PROPAGATED HERE silently:
# the `on:` blocks were identical in the two repos, so the cherry-pick applied
# cleanly even though this file is on the sync script's DIVERGENT list. That list
# predicts conflicts; it does not prevent merges. Guarded now by
# tests/test_ci_triggers.py.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


jobs:
  lint:
    # Separate from pytest so a style failure is never confused with a physics
    # failure. Config and its justified ignores live in pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_version_surface.py's tag half needs the tags.
          # A default checkout fetches none and the test skips.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check rb5s6s scripts tests

  # Every push gets this instead of the matrix: the fast suite on one
  # interpreter, ~2 minutes. The slow closures and the numpy-floor job run on
  # tags and on demand.
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TWO legs, not three (2026-08-11). The old matrix ran 3.9 twice and
        # 3.11 once, which spent two thirds of its time on an interpreter that
        # reached end of life in October 2025 and whose 'latest' leg was nearly
        # a duplicate of the maintainer's own machine (3.9.6). What each leg is
        # FOR, so a future change does not collapse them by accident:
        #   minimum -- the declared floor, and the only check that a new
        #              annotation or stdlib call has not silently raised it.
        #   latest  -- a current interpreter with current dependencies, which
        #              is deliberately UNLIKE the development machine. This is
        #              the leg that caught every real defect on 2026-08-11:
        #              a matplotlib API absent on one canvas class, and two
        #              figures whose labels cleared a guard locally by two
        #              pixels and not under a different font stack.
        #
        # The ceiling is PINNED, not floated to "3". scipy lags the newest
        # interpreter: at the time of writing numpy already ships cp315 wheels
        # and scipy does not, so a floating ceiling that resolved to 3.15 would
        # find no scipy wheel and fall back to a source build, which fails
        # slowly and with no code change to blame it on. Bump this by hand when
        # the whole dependency set has wheels for the next version.
        #
        # 3.14 rather than 3.13 because the maintainer's machine has 3.14, so
        # this leg can be reproduced locally when it disagrees with the gate.
        include:
          - python-version: "3.12"
            deps: minimum   # every declared floor pinned; see the step note below
          - python-version: "3.14"
            deps: latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # ALL FOUR floors, not two. The first two-leg run failed here
      # (2026-08-12): on 3.11 the editable install resolves LATEST matplotlib
      # (requires numpy>=1.25) and pandas (numpy-2 ABI), and pinning numpy to
      # the floor afterwards breaks both underneath. The old 3.9 leg only
      # worked because 3.9 itself capped pandas and matplotlib at versions
      # that tolerated numpy 1.24, which also means the DECLARED pandas 1.5
      # and matplotlib 3.6 floors were never actually tested. The floors in
      # pyproject were raised to match what this leg pins, so the manifest
      # promises exactly the oldest combination CI exercises.
      - name: pin declared minimum dependencies
        if: matrix.deps == 'minimum'
        run: pip install "numpy==2.5.0" "scipy==1.16.0" "pandas==2.2.3" "matplotlib==3.9.4"
      # FRESHNESS_CHECK on the latest leg only: the committed-CSV-vs-fresh-run
      # check takes ~4 min and its answer cannot differ between interpreters,
      # so running it on both costs ~4 minutes of Actions time for nothing.
      - run: pytest -q --runslow   # CI runs the full battery incl. slow closure tests
        env:
          FRESHNESS_CHECK: ${{ (matrix.deps == 'latest') && '1' || '0' }}
